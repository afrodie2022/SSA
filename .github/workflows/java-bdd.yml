name: Java Playwright BDD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile tests
        run: mvn --batch-mode --no-transfer-progress test-compile
      - name: Install Chromium and system libraries
        run: mvn --batch-mode --no-transfer-progress exec:java -Dexec.args="install --with-deps chromium"
      - name: Run BDD scenarios
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: java-bdd-reports
          path: |
            target/cucumber-reports/
            target/surefire-reports/
          if-no-files-found: ignore
